<section id="hero" class="hero section-dark" aria-labelledby="hero-title">
  <div class="hero__media" aria-hidden="true">
    <div class="hero__img-wrap">
      <img class="hero__img" src="/images/hero-pour.jpg" alt="" width="2400" height="1600" fetchpriority="high" decoding="async" />
    </div>
    <div class="hero__shade"></div>
    <div class="hero__steam-fallback">
      <span></span><span></span><span></span>
    </div>
    <canvas class="hero__steam"></canvas>
    <div class="hero__vignette"></div>
  </div>

  <div class="hero__content">
    <div class="hero__top">
      <p class="eyebrow hero__eyebrow"><span class="hero__eyebrow-inner">Coffee &amp; Bakehouse — Est. 2019</span></p>
    </div>

    <h1 class="hero__title display" id="hero-title">
      <span class="hero__line hero__line--1">Slow <em>coffee.</em></span>
      <span class="hero__line hero__line--2">Warm <em>crumbs.</em></span>
    </h1>

    <div class="hero__row">
      <p class="hero__lead">A neighbourhood coffee house on Hollis Lane. We roast on Tuesdays, bake before sunrise and keep the kettle warm all day.</p>
      <div class="hero__ctas">
        <div class="hero__cta-wrap">
          <a href="#menu" class="btn hero__cta" data-magnetic><span>See the menu</span></a>
        </div>
        <div class="hero__cta-wrap">
          <a href="#visit" class="btn btn--ghost hero__ghost" data-magnetic><span>Book a table</span></a>
        </div>
      </div>
    </div>

    <div class="hero__foot">
      <dl class="hero__hours">
        <div class="hero__hours-row"><dt>Mon–Fri</dt><dd>7:00–18:00</dd></div>
        <div class="hero__hours-row"><dt>Sat–Sun</dt><dd>8:00–17:00</dd></div>
        <div class="hero__hours-row hero__hours-row--addr"><dt class="visually-hidden">Address</dt><dd>14 Hollis Lane, Old Town</dd></div>
      </dl>

      <a href="#story" class="hero__badge" data-magnetic="0.25" aria-label="Scroll to our story">
        <svg class="hero__badge-ring" viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <path id="hero-badge-circle" d="M60 60 m-46 0 a46 46 0 1 1 92 0 a46 46 0 1 1 -92 0" />
          </defs>
          <text>
            <textPath href="#hero-badge-circle" textLength="288">Scroll · slowly · scroll · slowly ·</textPath>
          </text>
        </svg>
        <svg class="hero__badge-arrow" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 4v16M6 14l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>

      <figure class="hero__inset">
        <div class="hero__inset-clip">
          <img class="hero__inset-img" src="/images/hero-cup.jpg" alt="A flat white on a dark walnut table" width="600" height="750" decoding="async" />
        </div>
        <figcaption class="hero__inset-cap">
          <span>On the bar today</span>
          <span>Ethiopia Guji, washed</span>
        </figcaption>
      </figure>
    </div>
  </div>
</section>
