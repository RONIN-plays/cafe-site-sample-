<section id="testimonials" class="testimonials section-light" aria-labelledby="testimonials-title">
  <div class="testimonials__inner container">
    <header class="testimonials__head">
      <p class="testimonials__eyebrow eyebrow">05 — What people say</p>
      <h2 id="testimonials-title" class="testimonials__title display">Kind <em>words</em>.</h2>
    </header>

    <div class="testimonials__carousel" data-testimonials aria-roledescription="carousel" aria-label="Quotes from regulars and press">
      <span class="testimonials__mark display" aria-hidden="true">&ldquo;</span>

      <div class="testimonials__stage">
        <figure class="testimonials__slide is-active" role="group" aria-roledescription="slide" aria-label="1 of 5">
          <blockquote class="testimonials__quote display"><p>The cardamom bun alone is worth the walk across town.</p></blockquote>
          <figcaption class="testimonials__cite">
            <span class="testimonials__who">Old Town Gazette</span>
            <span class="testimonials__where">Weekend Eats, March 2025</span>
          </figcaption>
        </figure>
        <figure class="testimonials__slide" role="group" aria-roledescription="slide" aria-label="2 of 5">
          <blockquote class="testimonials__quote display"><p>My Saturday doesn&rsquo;t start until the flat white does.</p></blockquote>
          <figcaption class="testimonials__cite">
            <span class="testimonials__who">Priya</span>
            <span class="testimonials__where">Regular since 2020</span>
          </figcaption>
        </figure>
        <figure class="testimonials__slide" role="group" aria-roledescription="slide" aria-label="3 of 5">
          <blockquote class="testimonials__quote display"><p>Quietly the best sourdough in the city. Please don&rsquo;t tell anyone.</p></blockquote>
          <figcaption class="testimonials__cite">
            <span class="testimonials__who">Sunday Table</span>
            <span class="testimonials__where">Issue 14, &ldquo;Bread worth queueing for&rdquo;</span>
          </figcaption>
        </figure>
        <figure class="testimonials__slide" role="group" aria-roledescription="slide" aria-label="4 of 5">
          <blockquote class="testimonials__quote display"><p>I came in to get out of the rain. Four years on, I still take the seat by the window.</p></blockquote>
          <figcaption class="testimonials__cite">
            <span class="testimonials__who">Marguerite</span>
            <span class="testimonials__where">Neighbour, Hollis Lane</span>
          </figcaption>
        </figure>
        <figure class="testimonials__slide" role="group" aria-roledescription="slide" aria-label="5 of 5">
          <blockquote class="testimonials__quote display"><p>Roasted on a Tuesday, and you can taste the care by Wednesday.</p></blockquote>
          <figcaption class="testimonials__cite">
            <span class="testimonials__who">Pour/Over Quarterly</span>
            <span class="testimonials__where">The Neighbourhood Roasters list</span>
          </figcaption>
        </figure>
      </div>

      <div class="testimonials__controls">
        <p class="testimonials__count" aria-hidden="true">
          <span class="testimonials__count-now"><span class="testimonials__count-num">01</span></span>
          <span class="testimonials__count-sep">/</span>
          <span class="testimonials__count-total">05</span>
        </p>
        <div class="testimonials__progress" aria-hidden="true"><span class="testimonials__progress-fill"></span></div>
        <button class="testimonials__toggle" type="button" data-cursor="hover" aria-pressed="false">Pause</button>
        <div class="testimonials__arrows">
          <button class="testimonials__arrow testimonials__arrow--prev" type="button" data-magnetic data-cursor="hover" aria-label="Previous quote">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" /></svg>
          </button>
          <button class="testimonials__arrow testimonials__arrow--next" type="button" data-magnetic data-cursor="hover" aria-label="Next quote">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
          </button>
        </div>
      </div>

      <p class="visually-hidden testimonials__live" aria-live="polite" aria-atomic="true"></p>
    </div>

    <div class="testimonials__press">
      <p class="testimonials__press-label eyebrow">As featured in</p>
      <ul class="testimonials__press-list">
        <li class="testimonials__press-item testimonials__press-item--gazette">Old Town Gazette</li>
        <li class="testimonials__press-item testimonials__press-item--crumb">CRUMB.</li>
        <li class="testimonials__press-item testimonials__press-item--table">Sunday <span>Table</span></li>
        <li class="testimonials__press-item testimonials__press-item--pour">Pour/Over</li>
        <li class="testimonials__press-item testimonials__press-item--plate">the slow plate</li>
      </ul>
    </div>
  </div>
</section>
