<div class="preloader" data-preloader role="status" aria-live="polite" aria-label="Loading Marlow">
  <div class="preloader__panel preloader__panel--top" aria-hidden="true"></div>
  <div class="preloader__panel preloader__panel--bottom" aria-hidden="true"></div>
  <span class="preloader__seam" aria-hidden="true"></span>

  <div class="preloader__stage">
    <div class="preloader__meta preloader__meta--top" aria-hidden="true">
      <span class="preloader__mark">Marlow</span>
      <span class="preloader__meta-label">Coffee &amp; Bakehouse</span>
    </div>

    <div class="preloader__cup" aria-hidden="true">
      <svg class="preloader__svg" viewBox="0 0 200 200" fill="none">
        <defs>
          <clipPath id="preloader-cup-clip">
            <path d="M52 74 H148 L141 146 Q138 166 118 166 H82 Q62 166 59 146 Z" />
          </clipPath>
        </defs>

        <!-- steam strands (drawn in when the cup is full) -->
        <g class="preloader__steam" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
          <path class="preloader__steam-path" d="M86 58 C80 48 92 40 86 28" />
          <path class="preloader__steam-path" d="M100 60 C94 46 108 38 100 20" />
          <path class="preloader__steam-path" d="M114 58 C108 48 120 40 114 28" />
        </g>

        <!-- liquid -->
        <g clip-path="url(#preloader-cup-clip)">
          <g class="preloader__liquid" transform="translate(0 168)">
            <path class="preloader__wave preloader__wave--back"
              d="M0 6 Q12.5 0 25 6 T50 6 T75 6 T100 6 T125 6 T150 6 T175 6 T200 6 T225 6 T250 6 T275 6 T300 6 T325 6 T350 6 T375 6 T400 6 V140 H0 Z" />
            <path class="preloader__wave preloader__wave--front"
              d="M0 8 Q12.5 2 25 8 T50 8 T75 8 T100 8 T125 8 T150 8 T175 8 T200 8 T225 8 T250 8 T275 8 T300 8 T325 8 T350 8 T375 8 T400 8 V140 H0 Z" />
          </g>
        </g>

        <!-- line drawing -->
        <g class="preloader__lines" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path class="preloader__draw" d="M52 74 H148 L141 146 Q138 166 118 166 H82 Q62 166 59 146 Z" />
          <path class="preloader__draw" d="M146 92 C172 90 174 132 140 134" />
          <path class="preloader__draw" d="M34 176 Q100 186 166 176" />
        </g>
      </svg>
    </div>

    <div class="preloader__bottom">
      <p class="preloader__tagline">Good things take <em>a slow pour.</em></p>
      <div class="preloader__counter" aria-hidden="true"><span class="preloader__count" data-preloader-count>000</span></div>
    </div>
  </div>
</div>
